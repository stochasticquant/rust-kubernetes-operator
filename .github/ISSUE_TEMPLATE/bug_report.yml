name: Bug report
description: Something does not work as documented.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues must not be reported here** — use the
        "Report a security vulnerability" link instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal steps and manifests (remove any secrets).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ferrogate version
      placeholder: "ferrogate --version"
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version and distribution
      placeholder: "v1.36.4, k3s"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant operator logs. Remove anything sensitive.
      render: text
