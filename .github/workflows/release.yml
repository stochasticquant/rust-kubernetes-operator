name: Release

# Pushing a tag vX.Y.Z builds, tests, signs and publishes a release:
# - static binaries (linux amd64/arm64, macOS arm64) with SHA256SUMS and build provenance;
# - a multi-arch image on GHCR, signed with cosign (keyless), with SBOM and provenance;
# - the Helm chart as an OCI artifact on GHCR, signed;
# - a DRAFT GitHub release with the binaries, the install manifest pinned by digest and the notes
#   from CHANGELOG.md. A maintainer reviews and publishes the draft.
# On pull requests that touch release files, everything runs except publishing (dry run).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile.release
      - charts/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ferrogate
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Tag, Cargo and chart versions must agree
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          chart_version=$(sed -n 's/^version: //p' charts/ferrogate/Chart.yaml)
          app_version=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' charts/ferrogate/Chart.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF#refs/tags/v}
          else
            version=$cargo_version
          fi
          for v in "$cargo_version" "$chart_version" "$app_version"; do
            if [[ "$v" != "$version" ]]; then
              echo "::error::version mismatch: tag/expected $version, Cargo $cargo_version, chart $chart_version, appVersion $app_version"
              exit 1
            fi
          done
          grep -q "^## \[$version\]" CHANGELOG.md || [[ "$PUBLISH" != true ]] || {
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* || "$version" == 0.* ]] && pre=true || pre=false
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binary (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - {name: linux-amd64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, arch: amd64}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: arm64}
          - {name: darwin-arm64, runner: macos-latest, target: aarch64-apple-darwin, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build (locked, release profile)
        run: cargo build --release --locked -p ferrogate --target ${{ matrix.target }}
      - name: Smoke test
        run: target/${{ matrix.target }}/release/ferrogate --version
      - name: Package
        run: |
          name=ferrogate-${{ needs.version.outputs.version }}-${{ matrix.name }}
          mkdir -p "dist/$name" "image/${{ matrix.arch }}"
          cp target/${{ matrix.target }}/release/ferrogate LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cp target/${{ matrix.target }}/release/ferrogate "image/${{ matrix.arch }}/"
      - name: Build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - if: contains(matrix.target, 'linux')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image/
          if-no-files-found: error

  e2e:
    name: E2E (release binary on kind)
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: dist/
      - name: Build the release image for amd64
        run: docker build -f Dockerfile.release --build-arg TARGETARCH=amd64 -t ferrogate:dev .
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ferrogate
      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.1/cert-manager.yaml
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=180s
          kubectl -n cert-manager rollout status deploy/cert-manager-cainjector --timeout=180s
      - run: kind load docker-image ferrogate:dev --name ferrogate
      - name: End-to-end tests with the Helm chart
        run: INSTALL=helm tests/e2e/run.sh

  image:
    name: Image
    needs: [version, binaries, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: dist/
          merge-multiple: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.prerelease == 'false' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Helm chart
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package
        run: |
          helm lint --strict charts/ferrogate
          helm package charts/ferrogate --destination dist
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Push and sign
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          out=$(helm push "dist/ferrogate-${{ needs.version.outputs.version }}.tgz" "$CHART_REPO" 2>&1)
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<<"$out")
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "${CHART_REPO#oci://}/ferrogate@${digest}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz

  release:
    name: GitHub release (draft)
    needs: [version, binaries, image, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{binary-*,chart}"
          path: dist/
          merge-multiple: true
      - name: Install manifest pinned by digest
        run: |
          kubectl kustomize config/deploy \
            | sed "s|image: ghcr.io/stochasticquant/ferrogate:.*|image: ${IMAGE}@${{ needs.image.outputs.digest }}|" \
            > dist/ferrogate-install.yaml
          grep -q "@sha256:" dist/ferrogate-install.yaml
          cp config/crd/clustergatepolicies.ferrogate.stochasticquant.io.yaml dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Release notes from CHANGELOG.md
        run: |
          v=${{ needs.version.outputs.version }}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          {
            echo
            echo "### Verify"
            echo '```sh'
            echo "cosign verify ${IMAGE}@${{ needs.image.outputs.digest }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify ferrogate-$v-linux-amd64.tar.gz --repo ${{ github.repository }}"
            echo '```'
          } >> notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--draft --verify-tag --title "Ferrogate v${{ needs.version.outputs.version }}" --notes-file notes.md)
          [[ "${{ needs.version.outputs.prerelease }}" == true ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
