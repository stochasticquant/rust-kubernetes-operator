# Example policy: Deployments and StatefulSets must carry a `team` label.
# Audit mode only reports violations; nothing is blocked.
apiVersion: ferrogate.stochasticquant.io/v1alpha1
kind: ClusterGatePolicy
metadata:
  name: require-team-label
spec:
  mode: Audit
  severity: Medium
  match:
    resources:
      - apiGroups: [apps]
        kinds: [Deployment, StatefulSet]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease]
  rules:
    - name: team-label
      requireLabels: [team]
      message: "add a team label so the owning team can be found"
