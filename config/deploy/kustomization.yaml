# Install: kubectl apply -k config/deploy   (requires cert-manager)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../crd
  - namespace.yaml
  - rbac.yaml
  - certificate.yaml
  - operator.yaml
  - webhook.yaml
  - webhook-configuration.yaml
images:
  - name: ghcr.io/stochasticquant/ferrogate
    newTag: 0.1.0
