apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrogate-operator
  namespace: ferrogate-system
  labels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: operator}
spec:
  # Two replicas; a Lease elects the one that reconciles, the other takes over within ~15 s.
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: operator}
    spec:
      serviceAccountName: ferrogate-operator
      # A deposed leader exits at once; a short grace period speeds up hand-over on rollouts.
      terminationGracePeriodSeconds: 15
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: operator}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: ghcr.io/stochasticquant/ferrogate:0.1.0
          args: [operator, --leader-elect, --log-format=json]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports: [{name: metrics, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, periodSeconds: 20}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ferrogate-operator
  namespace: ferrogate-system
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: operator}
