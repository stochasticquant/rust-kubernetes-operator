apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrogate-webhook
  namespace: ferrogate-system
  labels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: webhook}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: webhook}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: webhook}
    spec:
      serviceAccountName: ferrogate-webhook
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: webhook}
      containers:
        - name: webhook
          image: ghcr.io/stochasticquant/ferrogate:0.1.0
          args: [webhook, --log-format=json]
          ports:
            - {name: https, containerPort: 8443}
            - {name: metrics, containerPort: 8080}
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, periodSeconds: 20}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts: [{name: tls, mountPath: /tls, readOnly: true}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: tls
          secret: {secretName: ferrogate-webhook-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: ferrogate-webhook
  namespace: ferrogate-system
  labels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: webhook}
spec:
  selector: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: webhook}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ferrogate-webhook
  namespace: ferrogate-system
spec:
  # maxUnavailable (not minAvailable) so a single replica never blocks node drains.
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ferrogate, app.kubernetes.io/component: webhook}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferrogate
  namespace: ferrogate-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ferrogate}
  policyTypes: [Ingress]
  ingress:
    # Admission requests (from the API server) and probes/metrics. Nothing else is listening.
    - ports: [{port: 8443}, {port: 8080}]
