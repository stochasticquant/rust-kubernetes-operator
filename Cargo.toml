[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/stochasticquant/rust-kubernetes-operator"
homepage = "https://github.com/stochasticquant/rust-kubernetes-operator"
authors = ["The Ferrogate Authors"]
keywords = ["kubernetes", "operator", "policy", "admission", "security"]
categories = ["command-line-utilities"]
publish = false

[workspace.dependencies]
# Internal crates
ferrogate-core = { path = "crates/ferrogate-core" }
ferrogate-crd = { path = "crates/ferrogate-crd" }
ferrogate-operator = { path = "crates/ferrogate-operator" }
ferrogate-webhook = { path = "crates/ferrogate-webhook" }

# Kubernetes
kube = { version = "4.2", default-features = false, features = ["client", "derive", "runtime", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["v1_34", "schemars"] }
schemars = "1.2"

# Runtime and HTTP
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal"] }
futures = "0.3"
axum = "0.8"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.7", features = ["limit", "timeout"] }
http-body-util = "0.1"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
prometheus-client = "0.25"

# CLI, serialization, errors, logging
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# Request paths must never panic: return errors instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Use `tracing`, not print macros.
print_stdout = "deny"
print_stderr = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
