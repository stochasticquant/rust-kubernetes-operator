# Pod Security Standards: restricted.
# Current pod hardening best practice. Includes everything in baseline.
# https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
apiVersion: ferrogate.stochasticquant.io/v1alpha1
kind: ClusterGatePolicy
metadata:
  name: pss-restricted
  annotations:
    ferrogate.stochasticquant.io/pack: pss-restricted
spec:
  mode: Audit
  severity: High
  match:
    resources:
      - apiGroups: [""]
        kinds: [Pod, ReplicationController]
      - apiGroups: [apps]
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
      - apiGroups: [batch]
        kinds: [Job, CronJob]
  exclude:
    namespaces: [kube-system]
  rules:
    - name: privileged
      disallowPrivileged: true
    - name: host-namespaces
      disallowHostNamespaces: true
    - name: host-path
      disallowHostPath: true
    - name: host-ports
      disallowHostPorts: true
    - name: capabilities
      allowedCapabilities: [NET_BIND_SERVICE]
    - name: drop-all-capabilities
      requireDropAllCapabilities: true
    - name: privilege-escalation
      disallowPrivilegeEscalation: true
    - name: run-as-non-root
      requireRunAsNonRoot: true
    - name: seccomp
      requireSeccompProfile: true
